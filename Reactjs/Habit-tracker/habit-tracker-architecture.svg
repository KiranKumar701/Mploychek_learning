<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Habit Tracker System Architecture</title>
  <desc id="desc">Clean high-level architecture diagram showing the React frontend, Express API, and MongoDB data store.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08101d"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#a78bfa"/>
    </marker>
    <style>
      .title { font: 700 38px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .section { font: 700 19px Arial, Helvetica, sans-serif; fill: #e2e8f0; letter-spacing: 0.5px; }
      .boxTitle { font: 700 23px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .boxText { font: 400 16px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .label { font: 700 15px Arial, Helvetica, sans-serif; fill: #a5b4fc; letter-spacing: 0.2px; }
      .card { fill: url(#panel); stroke: #334155; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .inner { fill: #0b1220; stroke: #334155; stroke-width: 1.5; rx: 18; }
      .accentLine { stroke: url(#accent); stroke-width: 6; stroke-linecap: round; }
      .arrow { stroke: #a78bfa; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="1230" cy="120" r="170" fill="#7c3aed" opacity="0.10"/>
  <circle cx="150" cy="790" r="220" fill="#ec4899" opacity="0.08"/>
  <circle cx="760" cy="450" r="280" fill="#22c55e" opacity="0.06"/>

  <text x="70" y="78" class="title">Habit Tracker System Architecture</text>
  <text x="70" y="112" class="subtitle">A simple full-stack flow: React UI sends habit actions to Express, and Express stores data in MongoDB.</text>

  <rect x="60" y="150" width="1280" height="690" class="card"/>
  <line x1="60" y1="230" x2="1340" y2="230" class="accentLine"/>

  <text x="270" y="200" text-anchor="middle" class="section">Presentation Layer</text>
  <text x="700" y="200" text-anchor="middle" class="section">Application Layer</text>
  <text x="1130" y="200" text-anchor="middle" class="section">Data Layer</text>

  <!-- Column 1 -->
  <rect x="95" y="270" width="350" height="525" class="inner"/>
  <rect x="120" y="298" width="300" height="70" rx="16" fill="#111827" stroke="#4c1d95" stroke-width="2"/>
  <text x="270" y="331" text-anchor="middle" class="boxTitle">Vite + React UI</text>
  <text x="270" y="355" text-anchor="middle" class="boxText">Browser UI for habits and weekly view</text>

  <rect x="120" y="390" width="300" height="150" rx="16" fill="#111827" stroke="#4c1d95" stroke-width="2"/>
  <text x="145" y="423" class="label">Main components</text>
  <text x="145" y="455" class="boxText">Header</text>
  <text x="145" y="483" class="boxText">HabitForm</text>
  <text x="145" y="511" class="boxText">HabitList</text>
  <text x="145" y="539" class="boxText">Button</text>

  <rect x="120" y="562" width="300" height="188" rx="16" fill="#111827" stroke="#4c1d95" stroke-width="2"/>
  <text x="145" y="595" class="label">Client responsibilities</text>
  <text x="145" y="627" class="boxText">Load habits on startup</text>
  <text x="145" y="655" class="boxText">Add, delete, and toggle completions</text>
  <text x="145" y="683" class="boxText">Week navigation and local streak math</text>
  <text x="145" y="711" class="boxText">Requests go through the /api proxy in dev</text>

  <!-- Column 2 -->
  <rect x="525" y="270" width="350" height="525" class="inner"/>
  <rect x="550" y="298" width="300" height="70" rx="16" fill="#111827" stroke="#1d4ed8" stroke-width="2"/>
  <text x="700" y="331" text-anchor="middle" class="boxTitle">Express API</text>
  <text x="700" y="355" text-anchor="middle" class="boxText">Runs on port 3001 during local development</text>

  <rect x="550" y="390" width="300" height="186" rx="16" fill="#111827" stroke="#1d4ed8" stroke-width="2"/>
  <text x="575" y="423" class="label">Habit routes</text>
  <text x="575" y="455" class="boxText">GET /api/habits</text>
  <text x="575" y="483" class="boxText">POST /api/habits</text>
  <text x="575" y="511" class="boxText">DELETE /api/habits/:id</text>
  <text x="575" y="539" class="boxText">PATCH /api/habits/:id/toggle</text>
  <text x="575" y="567" class="boxText">GET /api/health</text>

  <rect x="550" y="598" width="300" height="152" rx="16" fill="#111827" stroke="#1d4ed8" stroke-width="2"/>
  <text x="575" y="631" class="label">Request handling</text>
  <text x="575" y="663" class="boxText">Validates habit name and date input</text>
  <text x="575" y="691" class="boxText">Normalizes completion dates to day boundaries</text>
  <text x="575" y="719" class="boxText">Returns clean JSON responses</text>

  <!-- Column 3 -->
  <rect x="955" y="270" width="350" height="525" class="inner"/>
  <rect x="980" y="298" width="300" height="70" rx="16" fill="#111827" stroke="#16a34a" stroke-width="2"/>
  <text x="1130" y="331" text-anchor="middle" class="boxTitle">Mongoose Model</text>
  <text x="1130" y="355" text-anchor="middle" class="boxText">Habit schema stored in MongoDB</text>

  <rect x="980" y="390" width="300" height="186" rx="16" fill="#111827" stroke="#16a34a" stroke-width="2"/>
  <text x="1005" y="423" class="label">Stored fields</text>
  <text x="1005" y="455" class="boxText">name</text>
  <text x="1005" y="483" class="boxText">completions[]</text>
  <text x="1005" y="511" class="boxText">createdAt</text>
  <text x="1005" y="539" class="boxText">updatedAt</text>

  <rect x="980" y="598" width="300" height="152" rx="16" fill="#111827" stroke="#16a34a" stroke-width="2"/>
  <text x="1005" y="631" class="label">Persistence</text>
  <text x="1005" y="663" class="boxText">Stores habits and completion history</text>
  <text x="1005" y="691" class="boxText">Default local URI: localhost:27017/habit-tracker</text>
  <text x="1005" y="719" class="boxText">Read and update via Mongoose</text>

  <!-- Connectors -->
  <path d="M445 535 C480 535, 490 535, 525 535" class="arrow"/>
  <text x="482" y="496" text-anchor="middle" class="boxText">HTTP /api</text>
  <text x="482" y="517" text-anchor="middle" class="boxText">requests</text>

  <path d="M875 535 C910 535, 920 535, 955 535" class="arrow"/>
  <text x="915" y="496" text-anchor="middle" class="boxText">Mongoose</text>
  <text x="915" y="517" text-anchor="middle" class="boxText">queries</text>

  <path d="M270 805 C270 845, 700 845, 700 805" class="arrow" stroke-dasharray="9 8"/>
  <text x="700" y="836" text-anchor="middle" class="boxText">Vite dev server proxies /api to localhost:3001</text>
</svg>